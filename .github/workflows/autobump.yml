name: autobump ebuilds

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: gentoo-overlay-autobump
  cancel-in-progress: false

jobs:
  update:
    if: github.repository == 'kris004/gentoo-overlay' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.13"

      - name: Restore Gentoo QA caches
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25  # v5
        with:
          path: |
            ~/.cache/pkgcore
            ~/.cache/pkgcheck
          key: gentoo-overlay-autobump-v1

      - name: Install locked QA tools
        run: >-
          python -m pip install
          --disable-pip-version-check
          --only-binary=:all:
          --require-hashes
          --requirement metadata/autobump/requirements.txt

      - name: Test updater
        run: |
          python -m unittest discover -s scripts/tests -v
          shellcheck scripts/run-autobump.sh

      - name: Synchronize Gentoo repository
        run: pmaint --config no sync gentoo

      - name: Generate, validate, and publish updates
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/run-autobump.sh
